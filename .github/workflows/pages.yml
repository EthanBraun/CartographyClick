# Builds the site and publishes it to GitHub Pages on every push to mainline.
#
# Pages must be set to deploy from GitHub Actions (Settings > Pages > Source),
# not from a branch -- there is no gh-pages branch, the built site only ever
# exists as a workflow artifact.

name: Publish to GitHub Pages

on:
  push:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let an in-flight one finish rather than cancelling
# it, so the live site never ends up half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
